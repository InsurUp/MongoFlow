name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  PROJECT_PATH: 'src/Core/MongoFlow.csproj'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0    # Required to get the commit hash

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # The SDK global.json pins, and the .NET 10 runtime the net10.0 tests run on.
        global-json-file: global.json
        dotnet-version: 10.0.x

    - name: Get version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore MongoFlow.sln

    - name: Build
      run: dotnet build MongoFlow.sln --configuration Release --no-restore -p:Version=${{ steps.get_version.outputs.version }}

    # Both lanes on both frameworks; the integration lane starts MongoDB in Docker.
    - name: Run tests
      run: dotnet test --solution MongoFlow.sln --configuration Release --no-build

    - name: Pack
      run: >
        dotnet pack ${{ env.PROJECT_PATH }}
        --configuration Release
        --no-build
        --output artifacts/packages
        -p:Version=${{ steps.get_version.outputs.version }}

    - name: Push to NuGet
      run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
