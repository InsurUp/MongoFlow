name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write   # MongoFlow.V1 goes to GitHub Packages

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0    # Required to get the commit hash

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # The SDK global.json pins, and the .NET 10 runtime the net10.0 tests run on.
        global-json-file: global.json
        dotnet-version: 10.0.x

    - name: Get version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore MongoFlow.sln

    - name: Build
      run: dotnet build MongoFlow.sln --configuration Release --no-restore -p:Version=${{ steps.get_version.outputs.version }}

    # Both lanes on both frameworks; the integration lane starts MongoDB in Docker.
    - name: Run tests
      run: dotnet test --solution MongoFlow.sln --configuration Release --no-build

    # MongoFlow and MongoFlow.Identity ship together, with the tag's version.
    - name: Pack
      run: |
        for project in src/Core/MongoFlow.csproj src/Identity/MongoFlow.Identity.csproj; do
          dotnet pack "$project" --configuration Release --no-build --output artifacts/packages \
            -p:Version=${{ steps.get_version.outputs.version }}
        done

    # Each 1.x release also ships as MongoFlow.V1: the same library and namespace under its own package id and assembly
    # name, so an app can load it next to 0.5 while it moves module by module. Built apart from the regular build, and
    # packed apart from the packages nuget.org gets: it's only for that move, so it goes to GitHub Packages.
    - name: Pack MongoFlow.V1
      if: startsWith(github.ref_name, 'v1.')
      run: |
        dotnet pack src/Core/MongoFlow.csproj --configuration Release --artifacts-path artifacts/v1 \
          --output artifacts/v1-packages -p:Version=${{ steps.get_version.outputs.version }} \
          -p:PackageId=MongoFlow.V1 -p:AssemblyName=MongoFlow.V1 -p:IncludeSymbols=false

    - name: Push to NuGet
      run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Push MongoFlow.V1 to GitHub Packages
      if: startsWith(github.ref_name, 'v1.')
      run: dotnet nuget push "artifacts/v1-packages/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/InsurUp/index.json --skip-duplicate
